on:
  push:
    branches: [master, main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - run: ./gradlew build
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git push -f origin "$GITHUB_SHA:refs/tags/latest"
          gh release delete latest --yes || true
          gh release create latest build/libs/template.jar --title Latest --notes "" --latest
