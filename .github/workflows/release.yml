name: release
on:
  push:
    branches: ['26.*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      MC: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew build
      - name: Publish release for this branch
        run: |
          TAG="latest-$MC"
          JAR="viewmodel-$MC.jar"
          cp build/libs/viewmodel.jar "$JAR"
          # Only the newest MC branch gets GitHub's "Latest" badge.
          NEWEST=$(git ls-remote --heads origin '26.*' | sed 's|.*refs/heads/||' | sort -V | tail -1)
          [ "$MC" = "$NEWEST" ] && LATEST=true || LATEST=false
          gh release delete "$TAG" --yes || true
          git push -f origin "$GITHUB_SHA:refs/tags/$TAG"
          gh release create "$TAG" "$JAR" --title "ViewModel for MC $MC" \
            --notes "Built from \`$MC\` @ ${GITHUB_SHA::7}" --target "$GITHUB_SHA" --latest=$LATEST
