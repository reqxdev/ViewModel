name: release
on:
  push:
    branches: ['26.*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      MC: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew build
      - name: Upload jar to the shared Latest release
        run: |
          JAR="build/libs/viewmodel+$MC.jar"
          test -f "$JAR"
          gh release delete "latest-$MC" --cleanup-tag --yes || true
          git push -f origin "$GITHUB_SHA:refs/tags/latest"
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --title Latest --notes "Download the jar for your Minecraft version." --latest
          gh release upload latest "$JAR" --clobber
